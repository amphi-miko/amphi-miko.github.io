<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Item Prices</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 3rem auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.6rem;
      border-bottom: 1px solid #ddd;
    }
    th {
      text-align: left;
    }
    .updated {
      margin-top: 1rem;
      color: #666;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Current Prices</h1>

  <table id="price-table">
    <thead>
      <tr>
        <th>Item</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="updated" id="updated"></div>

<script>
  fetch("prices.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      const priceFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: data.currency
      });

      const mcapFormatter = new Intl.NumberFormat("en-US", {
        notation: "compact",
        maximumFractionDigits: 2
      });

      const tbody = document.querySelector("#price-table tbody");

      for (const [item, values] of Object.entries(data.items)) {
        const priceDollars = values.price / 100;
        const marketCap = values.mcap;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item}</td>
          <td>${priceFormatter.format(priceDollars)}</td>
          <td>${mcapFormatter.format(marketCap)}</td>
        `;

        tbody.appendChild(row);
      }
    })
    .catch(err => console.error(err));
</script>

</body>
</html>
