<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Item Prices</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 3rem auto;
      background: #111;
      color: #e5e5e5;
      font-size: 0.9rem;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid #333;
    }

    th {
      text-align: left;
      color: #aaa;
      font-weight: 600;
    }

    .updated {
      margin-top: 1rem;
      color: #888;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>Current Prices</h1>

  <table id="price-table">
    <thead>
      <tr>
        <th>Item</th>
        <th>Bid</th>
        <th>Ask</th>
        <th>Market Cap</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="updated" id="updated"></div>

<script>
  fetch("prices.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      const priceFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: data.currency
      });

      const mcapFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: data.currency,
        notation: "compact",
        maximumFractionDigits: 2
      });

      const tbody = document.querySelector("#price-table tbody");

      for (const [item, values] of Object.entries(data.items)) {
        const bidDollars = values.bid / 100;
        const askDollars = values.ask / 100;
        const marketCap = values.mcap / 100;

        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item}</td>
          <td>${priceFormatter.format(bidDollars)}</td>
          <td>${priceFormatter.format(askDollars)}</td>
          <td>${mcapFormatter.format(marketCap)}</td>
        `;

        tbody.appendChild(row);
      }
    })
    .catch(err => console.error(err));
</script>

</body>
</html>
