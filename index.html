<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.ico">
  <meta charset="UTF-8" />
  <title>Item Prices</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 700px;
      margin: 0.5rem auto;
      background: #111111;
      color: #ffffff;
      font-size: 0.8rem;
    }

    h1 {
      font-size: 1.0rem;
      margin-bottom: 0.2rem;
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 0.8rem;
    }    

    #market-cap-change {
      font-size: 0.8rem;
    } 

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.2rem 0.2rem;
      border-bottom: 1px solid #414141;
    }

    th[data-column] {
      text-align: left;
      color: #eeeeee;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      padding-right: 18px;
      border-right: 14px solid transparent;
    }
    
    th[data-column]:hover {
      background-color: #2a2a2a;
    }
    
    th[data-column]::after {
      content: ' ↕';
      position: absolute;
      right: 4px;
      opacity: 0.5;
    }

    th[data-column].sorted-asc::after {
      content: ' ↑';
      opacity: 1;
    }

    th[data-column].sorted-desc::after {
      content: ' ↓';
      opacity: 1;
    }
    
    th:nth-child(6), td:nth-child(6), /* 24h Change */
    th:nth-child(7), td:nth-child(7) { /* 7d Change */
      width: 10%; 
    }

    th:nth-child(3), td:nth-child(3){ /* Market Cap */
      width: 15%; 
    }    

    .updated {
      margin-top: 1rem;
      color: #888;
      font-size: 0.6rem;
    }
  </style>
</head>
<body>

  <h1>s&box Market Capitalization</h1>
  <h2 id="page-title"><span id="market-cap">$0.00</span> <span id="market-cap-change">0.00% in the past 24 hours</span></h2>


  <table id="price-table">
    <thead>
      <tr>
        <th></th>
        <th data-column="item">Item</th>
        <th data-column="marketCap">Market Cap</th>
        <th data-column="bid">Bid</th>
        <th data-column="ask">Ask</th>
        <th data-column="dayChange">24h Δ</th>
        <th data-column="weekChange">7d Δ</th>
        <th data-column="supply">Supply</th>
        <th>Buy</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="updated" id="updated"></div>

<script>
  // Store the data globally for sorting
  let tableData = [];
  let currentSortColumn = null;
  let currentSortDirection = 'asc';

  const priceFormatter = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "usd"
  });

  const mcapFormatter = new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "usd",
    notation: "compact",
    maximumFractionDigits: 2,
    minimumFractionDigits: 2
  });    
  
  const supplyFormatter = new Intl.NumberFormat("en-US", {
    maximumFractionDigits: 2
  });    

  const pFormatter = new Intl.NumberFormat("en-US", {
    style: "percent",
    maximumFractionDigits: 2,
    minimumFractionDigits: 2,
    signDisplay: "always"
  });

  // Function to render the table
  function renderTable(data) {
    const tbody = document.querySelector("#price-table tbody");
    tbody.innerHTML = ''; // Clear existing rows

    for (const rowData of data) {
      const row = document.createElement("tr");
      
      // Image cell
      const imgCell = document.createElement("td");
      const img = document.createElement("img");
      img.src = `assets/${rowData.item}.png`;
      img.alt = rowData.item;
      img.width = 24;
      img.height = 24;
      img.loading = "lazy";
      img.onerror = () => {
        img.style.display = "none";
      };
      imgCell.appendChild(img);
      
      // Item cell
      const itemCell = document.createElement("td");
      const itemLink = document.createElement("a");
      itemLink.href = `https://steamcommunity.com/market/listings/590830/${rowData.item}`; 
      itemLink.target = "_blank";
      itemLink.textContent = rowData.item;
      itemLink.style.color = "white";
      itemCell.appendChild(itemLink);

      // Market Cap cell
      const mcapCell = document.createElement("td");
      mcapCell.textContent = mcapFormatter.format(rowData.marketCap);

      // Bid cell
      const bidCell = document.createElement("td");
      bidCell.textContent = priceFormatter.format(rowData.bid);
      
      // Ask cell
      const askCell = document.createElement("td");
      askCell.textContent = priceFormatter.format(rowData.ask);
      
      // 24h Change cell
      const dayChangeCell = document.createElement("td");
      dayChangeCell.textContent = pFormatter.format(rowData.dayChange);
      if (rowData.dayChange < 0) {
        dayChangeCell.style.color = "#ff0000";
      } else if (rowData.dayChange > 0) {
        dayChangeCell.style.color = "#00ff00";
      } else {
        dayChangeCell.style.color = "gray";
      }
      
      // 7d Change cell
      const weekChangeCell = document.createElement("td");
      weekChangeCell.textContent = pFormatter.format(rowData.weekChange);
      if (rowData.weekChange < 0) {
        weekChangeCell.style.color = "#ff0000";
      } else if (rowData.weekChange > 0) {
        weekChangeCell.style.color = "#00ff00";
      } else {
        weekChangeCell.style.color = "gray";
      }

      // Supply cell
      const supplyCell = document.createElement("td");
      supplyCell.textContent = supplyFormatter.format(rowData.supply);

      // Store cell
      const storeCell = document.createElement("td");
      storeCell.style.textAlign = "center";
      const storeImg = document.createElement("img");
      const storeLink = document.createElement("a")
      if (rowData.in_store) {
        storeImg.src = `assets/s&box Blue.jpg`;
        storeLink.href = `${rowData.store_url}/1`; 
        storeLink.target = "_blank";
        storeImg.alt = "Available";
      } else {
        storeImg.src = `assets/s&box Grey.jpg`;
        storeImg.alt = "Unavailable";
      }
      storeImg.width = 24;
      storeImg.height = 24;
      storeImg.loading = "lazy";
      storeImg.onerror = () => {
        storeImg.style.display = "none";
      };
      storeLink.appendChild(storeImg);
      storeCell.appendChild(storeLink);   
      
      row.append(imgCell, itemCell, mcapCell, bidCell, askCell, dayChangeCell, weekChangeCell,supplyCell,storeCell);
      tbody.appendChild(row);
    }
  }

  // Function to sort data
  function sortData(column, direction) {
    const sortedData = [...tableData];
    
    sortedData.sort((a, b) => {
      let valA, valB;
      
      switch(column) {
        case 'item':
          valA = a.item;
          valB = b.item;
          break;
        case 'marketCap':
        case 'bid':
        case 'ask':
        case 'dayChange':
        case 'weekChange':
        case 'supply':
          valA = a[column];
          valB = b[column];
          break;
        case 'image':
          // Sort by image name/id
          valA = a.id;
          valB = b.id;
          break;
        default:
          return 0;
      }
      
      // Compare values
      if (valA < valB) return direction === 'asc' ? -1 : 1;
      if (valA > valB) return direction === 'asc' ? 1 : -1;
      return 0;
    });
    
    return sortedData;
  }

  // Function to handle header clicks
  function handleHeaderClick(event) {
    const header = event.currentTarget;
    const column = header.dataset.column;
    
    // Determine sort direction
    if (currentSortColumn === column) {
      currentSortDirection = currentSortDirection === 'asc' ? 'desc' : 'asc';
    } else {
      currentSortColumn = column;
      currentSortDirection = 'asc';
    }
    
    // Update header styles
    const headers = document.querySelectorAll('#price-table thead th');
    headers.forEach(h => {
      h.classList.remove('sorted-asc', 'sorted-desc');
    });
    header.classList.add(`sorted-${currentSortDirection}`);
    
    // Sort and render
    const sortedData = sortData(column, currentSortDirection);
    renderTable(sortedData);
  }

// Function to render the table
  function renderMarketCap(data) {
    let currentMarketCap = 0
    let dayMarketCap = 0
    let weekMarketCap = 0
    for (const rowData of data) {
      currentMarketCap += rowData.marketCap;
      dayMarketCap += rowData.marketCap/(1+rowData.dayChange);
      weekMarketCap += rowData.marketCap/(1+rowData.weekChange);
    }
    const dayMarketCapChange = (currentMarketCap - dayMarketCap) / dayMarketCap;
    const weekMarketCapChange = (currentMarketCap - weekMarketCap) / weekMarketCap;
    const dayMarketCapDifference = currentMarketCap-dayMarketCap

    if (dayMarketCapChange < 0) {
        dayMarketCapChangeColor = "#ff0000";
        document.body.style.background = "linear-gradient(to bottom, #1b1111, #111111)";
      } else if (dayMarketCapChange > 0) {
        dayMarketCapChangeColor = "#00ff00";
        document.body.style.background = "linear-gradient(to bottom, #111b11, #111111)";
      } else {
        dayMarketCapChangeColor = "gray";
        document.body.style.background = "linear-gradient(to bottom, #111111, #111111)";
      }

    document.getElementById('market-cap').textContent = priceFormatter.format(currentMarketCap)
    document.getElementById('market-cap-change').textContent = pFormatter.format(dayMarketCapChange) + " in the past 24 hours"
    document.getElementById('market-cap-change').style.color = dayMarketCapChangeColor
  }

  // Fetch and initialize the table
  fetch("site_info.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      // Convert the object data to array format for easier sorting
      tableData = Object.entries(data).map(([item, obj]) => ({
        item: item,
        in_store: obj.in_store,
        store_url: obj.store_url,
        supply:obj.supply,
        bid: obj.bid,
        ask: obj.ask,
        marketCap: obj.marketCap,
        dayChange: obj.dayChange,
        weekChange: obj.weekChange
      }));

      // Set default sort to Market Cap (descending - largest first)
      currentSortColumn = 'marketCap';
      currentSortDirection = 'desc';
      
      // Sort the data by Market Cap
      const sortedData = sortData(currentSortColumn, currentSortDirection); 

      // Initial render
      renderTable(sortedData);

      renderMarketCap(sortedData);
      
      // Add click handlers to headers
      const headers = document.querySelectorAll('#price-table thead th[data-column]');
      headers.forEach(header => {
        header.addEventListener('click', handleHeaderClick);
      });
      
      // Highlight the Market Cap header as sorted
      const marketCapHeader = document.querySelector('th[data-column="marketCap"]');
      marketCapHeader.classList.add(`sorted-${currentSortDirection}`);

      // Set current date
      document.getElementById('updated').textContent = `Updated: ${new Date().toLocaleString()}`;
    })
    .catch(err => console.error(err));
</script>

</body>
</html>
