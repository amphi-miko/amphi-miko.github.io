<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta charset="UTF-8" />
  <title>Item Prices</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 1rem auto;
      background: #111;
      color: #ffffff;
      font-size: 0.8rem;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 0.6rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.2rem 0.2rem;
      border-bottom: 1px solid #414141;
    }

    th {
      text-align: left;
      color: #eeeeee;
      font-weight: 600;
    }

    .updated {
      margin-top: 1rem;
      color: #888;
      font-size: 0.6rem;
    }
  </style>
</head>
<body>

  <h1>s&box Market Summary - Discontinued Items</h1>

  <table id="price-table">
    <thead>
      <tr>
        <th>Image</th>
        <th>Item</th>
        <th>Bid</th>
        <th>Ask</th>
        <th>Market Cap</th>
        <th>24h Change</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="updated" id="updated"></div>

<script>
  fetch("item_info.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {

      const priceFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "usd"
      });

      const mcapFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "usd",
        notation: "compact",
        maximumFractionDigits: 2
      });   

      const pFormatter = new Intl.NumberFormat("en-US", {
        style: "percent",        // formats as percentage
        maximumFractionDigits: 2 // up to 2 decimal places
      });

      const tbody = document.querySelector("#price-table tbody");
      for (const [item, obj] of Object.entries(data)) {
        const history = obj.history; 
        if (!history || !history.length) continue;

        const firstBid = history[history.length - 1].bid;
        const lastBid = history[0].bid;
        const bidDollars = firstBid / 100;
        const askDollars = history[history.length - 1].ask / 100;
        const marketCap = history[history.length - 1].mcap / 100;
        const change = lastBid ? firstBid / lastBid - 1 : 0;

        const row = document.createElement("tr");
      
        const imgCell = document.createElement("td");
        const img = document.createElement("img");

        img.src = `assets/${obj.id}.png`;
        img.alt = item;
        img.width = 24;     // optional
        img.height = 24;    // optional
        img.loading = "lazy";

        img.onerror = () => {
          img.style.display = "none"; // or swap to a default image
        };

        imgCell.appendChild(img);

        const itemCell = document.createElement("td");
        itemCell.textContent = item;
      
        const bidCell = document.createElement("td");
        bidCell.textContent = priceFormatter.format(bidDollars);
      
        const askCell = document.createElement("td");
        askCell.textContent = priceFormatter.format(askDollars);
      
        const mcapCell = document.createElement("td");
        mcapCell.textContent = mcapFormatter.format(marketCap);
      
        const changeCell = document.createElement("td");
        changeCell.textContent = pFormatter.format(change);
      
        if (change < 0) {
          changeCell.style.color = "red";
        } else if (change > 0) {
          changeCell.style.color = "green";
        } else {
          changeCell.style.color = "gray";
        }
      
        row.append(imgCell, itemCell, bidCell, askCell, mcapCell, changeCell);
        tbody.appendChild(row);
      }
    })
    .catch(err => console.error(err));
</script>

</body>
</html>
