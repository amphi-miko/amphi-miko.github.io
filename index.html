<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Item Prices</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 3rem auto;
      background: #111;
      color: #e5e5e5;
      font-size: 0.9rem;
    }

    h1 {
      font-size: 1.2rem;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.45rem 0.6rem;
      border-bottom: 1px solid #333;
    }

    th {
      text-align: left;
      color: #aaa;
      font-weight: 600;
    }

    .updated {
      margin-top: 1rem;
      color: #888;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <h1>Current Prices</h1>

  <table id="price-table">
    <thead>
      <tr>
        <th>Item</th>
        <th>Bid</th>
        <th>Ask</th>
        <th>Market Cap</th>
        <th>Change</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="updated" id="updated"></div>

<script>
  fetch("prices.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      const priceFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: data.currency
      });

      const mcapFormatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: data.currency,
        notation: "compact",
        maximumFractionDigits: 2
      });

      const pFormatter = new Intl.NumberFormat("en-US", {
        style: "percent",        // formats as percentage
        maximumFractionDigits: 2 // up to 2 decimal places
      });

      const tbody = document.querySelector("#price-table tbody");

      for (const [item, obj] of Object.entries(data.items)) {
        const history = obj.history[0]; // unwrap the inner array
        if (!history || !history.length) continue;
      
        const firstBid = history[0].bid;
        const lastBid = history[history.length - 1].bid;
        const bidDollars = firstBid / 100;
        const askDollars = history[0].ask / 100;
        const marketCap = history[0].mcap / 100;
        const change = lastBid ? firstBid / lastBid - 1 : 0;
      
        const row = document.createElement("tr");
      
        const itemCell = document.createElement("td");
        itemCell.textContent = item;
      
        const bidCell = document.createElement("td");
        bidCell.textContent = priceFormatter.format(bidDollars);
      
        const askCell = document.createElement("td");
        askCell.textContent = priceFormatter.format(askDollars);
      
        const mcapCell = document.createElement("td");
        mcapCell.textContent = mcapFormatter.format(marketCap);
      
        const changeCell = document.createElement("td");
        changeCell.textContent = pFormatter.format(change);
      
        if (change < 0) {
          changeCell.style.color = "red";
        } else if (change > 0) {
          changeCell.style.color = "green";
        } else {
          changeCell.style.color = "gray";
        }
      
        row.append(itemCell, bidCell, askCell, mcapCell, changeCell);
        tbody.appendChild(row);
      }
    })
    .catch(err => console.error(err));
</script>

</body>
</html>
