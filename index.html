<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live s&box item market capitalization, bids, asks, and supply data." />
  <title>s&box Market Capitalization</title>
  <link rel="icon" type="image/png" href="assets/favicon.ico">

  <style>
    :root {
      --bg: #111;
      --bg-soft: #1a1a1a;
      --border: #2a2a2a;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --positive: #22c55e;
      --negative: #ef4444;
      --positivemuted: #1a2f1d;
      --negativemuted: #2f1a1a;
      --neutral: #9ca3af;
      --selected: #3b82f6;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 900px;
      margin: 1rem auto;
      padding: 0 1rem;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .card {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      padding: 0.7rem;
      border-radius: 8px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .card-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-value {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .card-change {
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    .card-positive { background-color: var(--positivemuted); border-color: var(--positive); }
    .card-negative { background-color: var(--negativemuted); border-color: var(--negative); }
    .card-neutral  { background-color: var(--bg-soft); border-color: var(--border); }

    .table-wrapper {
      overflow-x: auto;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      margin-bottom: 1rem;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-shrink: 0;
    }

    #search-input {
      flex: 1;
      padding: 0.45rem 0.5rem;
      font-size: 0.85rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }

    #search-input:focus {
      border-color: var(--selected);
    }

    #search-input:hover {
      border-color: var(--selected);
    }

    #last-updated {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }

    #currency-select {
      padding: 0.45rem 0.5rem;
      font-size: 1.0rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
      cursor: pointer;
    }

    #currency-select:hover {
      border-color: var(--selected);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 2;
    }

    th, td {
      padding: 0.2rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th[data-column] {
      cursor: pointer;
      text-align: left;
      font-weight: 600;
      position: relative;
      padding-right: 18px;
    }

    th[data-column]::after {
      content: "↕";
      position: absolute;
      right: 4px;
      opacity: 0.4;
    }

    th.sorted-asc::after {
      content: "↑";
      opacity: 1;
    }

    th.sorted-desc::after {
      content: "↓";
      opacity: 1;
    }

    tbody tr:hover {
      background: var(--bg-soft);
    }

    .positive { color: var(--positive); }
    .negative { color: var(--negative); }
    .neutral  { color: var(--neutral); }

    @media (max-width: 580px) {
      th:nth-child(4),
      td:nth-child(4),
      th:nth-child(6),
      td:nth-child(6),      
      th:nth-child(8),
      td:nth-child(8),    
      th:nth-child(9),
      td:nth-child(9),
      th:nth-child(10),
      td:nth-child(10),
      th:nth-child(11),
      td:nth-child(11),
      th:nth-child(12),
      td:nth-child(12) {
        display: none;
      }

      th:nth-child(2), 
      td:nth-child(2) { 
        width: 80px !important;
      }

      .toolbar-right {
        justify-content: space-between;
      }
      
        #last-updated {
        display: none;
      }   
      
        #toggle-columns-btn {
        display: none;
      }        
    }

    th:nth-child(1), td:nth-child(1) { width: 30px; }   /* icon */
    th:nth-child(2), td:nth-child(2) { width: 180px; }  /* item name */
    th:nth-child(3), td:nth-child(3) { width: 70px; }  /* market cap */
    th:nth-child(4), td:nth-child(4) { width: 55px; }  /* Inv Value */
    th:nth-child(5), td:nth-child(5) { width: 60px; }   /* bid */
    th:nth-child(6), td:nth-child(6) { width: 60px; }   /* ask */
    th:nth-child(7), td:nth-child(7) { width: 50px; }   /* 24h */
    th:nth-child(8), td:nth-child(8) { width: 60px; }   /* 7d */
    th:nth-child(9), td:nth-child(9) { width: 40px; }   /* supply */
    th:nth-child(10), td:nth-child(10) { width: 35px; }   /* supply delta */
    th:nth-child(11), td:nth-child(11) { width: 70px; }  /* Inv Qty */
    th:nth-child(12), td:nth-child(12) { width: 35px; } /* store */

    #search-input {
      width: 100%;
      padding: 0.5rem;
      font-size: 0.9rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
    }

    #toggle-columns-btn {
      padding: 0.45rem 0.5rem;
      font-size: 1.0rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-soft);
      color: var(--text);
      cursor: pointer;
    }

    #toggle-columns-btn:hover {
      border-color: var(--selected);
    }    

    .inventory-input {
      width: 60px;
      padding: 0.25rem;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      text-align: left;
    }

    .inventory-input:focus {
      border-color: var(--selected);
      outline: none;
    }

    .inventory-value {
      text-align: left;
      font-weight: 500;
    }   
    
    .hidden-col {
      display: none;
    }    
  </style>
</head>

<body>
<div class="cards">
  <div class="card" id="total-card">
    <div class="card-label">s&box Total Market Cap</div>
    <div class="card-value" id="market-cap">$0.00</div>
    <div class="card-change neutral" id="market-cap-change">
      0.00% in the past 24 hours
    </div>
  </div>

  <div class="card" id="filtered-card" style="display:none;">
    <div class="card-label">Market Cap of Filtered Items</div>
    <div class="card-value" id="filtered-market-cap">$0.00</div>
    <div class="card-change neutral" id="filtered-market-cap-change">
      0.00% in the past 24 hours
    </div>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="search-input" placeholder="Search items..." />

  <div class="toolbar-right">
    <button id="toggle-columns-btn" class="toggle-btn">
      INVENTORY
    </button> 
    <select id="currency-select">
      <option value="USD">USD</option>
    </select>

    <div id="last-updated">Updated: —</div>
  </div>
</div>

<div class="table-wrapper">
  <table id="price-table">
    <thead>
      <tr>
        <th scope="col"></th>
        <th scope="col" data-column="item" title="Item name">Item</th>
        <th scope="col" data-column="bidMarketCap" title="Market cap based on bid price">Market Cap</th>
        <th scope="col" data-column="inventoryValue" title="Value of your inventory">Value</th>         
        <th scope="col" data-column="bid" title="Current bid price on Steam market">Bid</th>
        <th scope="col" data-column="ask" title="Current ask price on Steam market">Ask</th>
        <th scope="col" data-column="dayBidChange" title="Change in Steam market bid price over the last 24 hours">24h %</th>
        <th scope="col" data-column="weekBidChange" title="Change in Steam market bid price over the last 7 days">7d %</th>
        <th scope="col" data-column="supply" title="Current supply of the item">Supply</th>
        <th scope="col" data-column="supplyDelta" title="Change in item supply over the last 24 hours">24h Δ</th>    
        <th scope="col" data-column="inventoryQty" title="Your inventory quantity">Holdings</th>   
        <th title="Store link if on sale">Store</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
(() => {
  "use strict";

  const tbody = document.querySelector("#price-table tbody");
  const headers = document.querySelectorAll("#price-table thead th[data-column]");

  const marketCapEl = document.getElementById("market-cap");
  const marketChangeEl = document.getElementById("market-cap-change");
  const totalCardEl = document.getElementById("total-card");

  const filteredCardEl = document.getElementById("filtered-card");
  const filteredMarketCapEl = document.getElementById("filtered-market-cap");
  const filteredMarketChangeEl = document.getElementById("filtered-market-cap-change");

  const searchInput = document.getElementById("search-input");

  let tableData = [];
  let currentSortColumn = "bidMarketCap";
  let currentSortDirection = "desc";
  let currentSearchQuery = "";
  let currentCurrency = "USD";
  let currencyRates = { USD: { rate: 1 } }; // default
  let inventoryData = {};
  // Column visibility state
  let showValueHoldings = false; // false = show Market Cap, Supply, 24h Δ (default)

  // Column indices (0-based)
  const colMarketCap = 2;   // Market Cap
  const colSupply = 8;      // Supply
  const colSupplyDelta = 9; // 24h Δ
  const colValue = 3;       // Value
  const colHoldings = 10;   // Holdings

  // Load inventory from localStorage
  function loadInventory() {
    try {
      const saved = localStorage.getItem("inventoryData");
      if (saved) {
        inventoryData = JSON.parse(saved);
      }
    } catch (e) {
      console.error("Failed to load inventory:", e);
    }
  }

  // Save inventory to localStorage
  function saveInventory() {
    try {
      localStorage.setItem("inventoryData", JSON.stringify(inventoryData));
    } catch (e) {
      console.error("Failed to save inventory:", e);
    }
  }

  // Add this function after calculateTotalInventoryValue()
  function calculateTotalInventoryMarketCap() {
    let total = 0;
    tableData.forEach(item => {
      const qty = inventoryData[item.item] || 0;
      if (qty > 0) {
        total += (item.bid || 0) * qty;
      }
    });
    return total;
  }

  // Add function to calculate filtered inventory value
  function calculateFilteredInventoryMarketCap(filteredData) {
    let total = 0;
    filteredData.forEach(item => {
      const qty = inventoryData[item.item] || 0;
      if (qty > 0) {
        total += (item.bid || 0) * qty;
      }
    });
    return total;
  }

  // Add function to calculate previous inventory value for percentage change
  function calculatePreviousInventoryValue(data, isFiltered = false) {
    let previous = 0;
    const fx = currencyRates[currentCurrency] || { dayRateChange: 0 };
    
    const itemsToProcess = isFiltered ? data : tableData;
    
    itemsToProcess.forEach(item => {
      const qty = inventoryData[item.item] || 0;
      if (qty > 0 && item.dayBidChange > -1) {
        const adjustedDayChange = adjustForFX(item.dayBidChange, fx.dayRateChange);
        const previousPrice = item.bid / (1 + adjustedDayChange);
        previous += previousPrice * qty;
      }
    });
    
    return previous;
  }

  function convert(value) {
    const rate = currencyRates[currentCurrency]?.rate || 1;
    return value / rate;
  }

  function applyColumnVisibility() {
    const rows = document.querySelectorAll("#price-table tr");
    rows.forEach(row => {
      const cells = row.cells;
      if (!cells.length) return;

      if (showValueHoldings) {
        // Show Value & Holdings, hide Market Cap, Supply, 24h Δ
        if (cells[colMarketCap]) cells[colMarketCap].classList.add("hidden-col");
        if (cells[colSupply]) cells[colSupply].classList.add("hidden-col");
        if (cells[colSupplyDelta]) cells[colSupplyDelta].classList.add("hidden-col");
        if (cells[colValue]) cells[colValue].classList.remove("hidden-col");
        if (cells[colHoldings]) cells[colHoldings].classList.remove("hidden-col");
      } else {
        // Show Market Cap, Supply, 24h Δ, hide Value & Holdings (default)
        if (cells[colMarketCap]) cells[colMarketCap].classList.remove("hidden-col");
        if (cells[colSupply]) cells[colSupply].classList.remove("hidden-col");
        if (cells[colSupplyDelta]) cells[colSupplyDelta].classList.remove("hidden-col");
        if (cells[colValue]) cells[colValue].classList.add("hidden-col");
        if (cells[colHoldings]) cells[colHoldings].classList.add("hidden-col");
      }
    });
  }
  function toggleColumns() {
    showValueHoldings = !showValueHoldings;
    localStorage.setItem("inventoryMode", showValueHoldings); // Save preference
    const btn = document.getElementById("toggle-columns-btn");
    if (btn) {
      btn.textContent = showValueHoldings
        ? "MARKET"
        : "INVENTORY";
    }
    applyColumnVisibility();
    updateView();  // ← This forces the cards to update immediately
  }

  function adjustForFX(itemChange, fxChange) {
    if (itemChange == null) return 0;
    if (!fxChange) return itemChange; // USD fallback
    return (1 + itemChange) / (1 + fxChange) - 1;
  }

  function getChangeClass(value) {
    if (value > 0) return "positive";
    if (value < 0) return "negative";
    return "neutral";
  }

  function updateSortIndicators(activeHeader) {
    headers.forEach(h => {
      h.classList.remove("sorted-asc", "sorted-desc");
      h.removeAttribute("aria-sort");
    });
    if (activeHeader) {
      activeHeader.classList.add(`sorted-${currentSortDirection}`);
      activeHeader.setAttribute("aria-sort",
        currentSortDirection === "asc" ? "ascending" : "descending"
      );
    }
  }

    function getProcessedData() {
    let processed = tableData.filter(item =>
      item.item.toLowerCase().includes(currentSearchQuery)
    );

    // Add inventory properties for sorting
    processed = processed.map(item => ({
      ...item,
      inventoryQty: inventoryData[item.item] || 0,
      inventoryValue: (item.bid || 0) * (inventoryData[item.item] || 0)
    }));

    processed.sort((a, b) => {
      let valA = a[currentSortColumn];
      let valB = b[currentSortColumn];

      // Handle inventory columns specially if needed
      if (currentSortColumn === "inventoryQty" || currentSortColumn === "inventoryValue") {
        valA = valA || 0;
        valB = valB || 0;
      }

      if (currentSortColumn === "item") {
        return currentSortDirection === "asc"
          ? valA.localeCompare(valB)
          : valB.localeCompare(valA);
      }
      return currentSortDirection === "asc" ? valA - valB : valB - valA;
    });

    return processed;
  }

  function renderTable(data) {
  tbody.innerHTML = "";
  const fragment = document.createDocumentFragment();
  const { price, compact, percent ,signedNumber,number} = getFormatters();

  data.forEach(item => {
    const row = document.createElement("tr");
    const fx = currencyRates[currentCurrency] || { dayRateChange: 0, weekRateChange: 0 };

    const dayChangeFX = adjustForFX(item.dayBidChange, fx.dayRateChange);
    const weekChangeFX = adjustForFX(item.weekBidChange, fx.weekRateChange);
    
    // Use the pre-calculated inventory values from getProcessedData
    const qty = item.inventoryQty || 0;
    const inventoryValue = item.inventoryValue || 0;

    row.innerHTML = `
      <td><img src="assets/${item.item}.png" width="30" height="30" loading="lazy" decoding="async" alt="${item.item}" /></td>
      <td>
        <a href="https://steamcommunity.com/market/listings/590830/${item.item}"
           target="_blank"
           rel="noopener noreferrer"
           style="color:white">
          ${item.item}
        </a>
      </td>
      <td>${compact(convert(item.bidMarketCap))}</td>
      <td class="inventory-value">${compact(convert(inventoryValue))}</td>
      <td>${compact(convert(item.bid))}</td>
      <td>${compact(convert(item.ask))}</td>
      <td class="${getChangeClass(dayChangeFX)}">${percent(dayChangeFX)}</td>
      <td class="${getChangeClass(weekChangeFX)}">${percent(weekChangeFX)}</td>
      <td>${number(item.supply)}</td>
      <td>${signedNumber(item.supplyDelta)}</td>
      <td><input type="number" min="0" step="1" value="${qty}" 
           class="inventory-input" data-item="${item.item}" 
           placeholder="0"></td>
      <td style="text-align:center; font-size: 1.2rem;">
        ${item.inStore
          ? `<a href="${item.storeUrl}/1" target="_blank" rel="noopener noreferrer" style="color:var(--text); text-decoration:none; cursor:pointer;">✔</a>`
          : `<span style="color:var(--border); cursor:not-allowed;">✖</span>`}
      </td>
    `;
    fragment.appendChild(row);
  });

  tbody.appendChild(fragment);
}

  function calculateMarketCap(data) {
    let current = 0;
    let previous = 0;

    const fx = currencyRates[currentCurrency] || { dayRateChange: 0 };

    data.forEach(item => {
      current += item.bidMarketCap;

      if (item.dayBidChange > -1 && item.daySupplyChange > -1) {
        const adjustedDayChange = adjustForFX(item.dayBidChange, fx.dayRateChange);

        previous += (item.bidMarketCap / (1 + adjustedDayChange)) /
                    (1 + item.daySupplyChange);
      }
    });

    const change = previous > 0 ? (current - previous) / previous : 0;
    return { current, change };
  }

  function getFormatters() {
    const priceFormatter = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: currentCurrency
    });

    const compactFormatter = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: currentCurrency,
      notation: "compact",
      maximumFractionDigits: 2,
      minimumFractionDigits: 2
    });
    const percentFormatter = new Intl.NumberFormat("en-US", { style: "percent", maximumFractionDigits: 2, minimumFractionDigits: 2, signDisplay: "always" });
    const signedNumberFormatter = new Intl.NumberFormat("en-US", {maximumFractionDigits: 0, signDisplay: "exceptZero" });
    const numberFormatter = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
    const dateFormatter = new Intl.DateTimeFormat("en-US", {
      year: "numeric",
      month: "short",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      timeZoneName: "short"
    });

    return {
      price: (cents) => priceFormatter.format(cents / 100),
      compact: (cents) => compactFormatter.format(cents / 100),
      percent: (value) => percentFormatter.format(value),
      signedNumber: (value) => signedNumberFormatter.format(value),
      number: (value) => numberFormatter.format(value),
      date: (value) => dateFormatter.format(value),
    };
  }

function updateView() {
  const processed = getProcessedData();
  
  renderTable(processed);
  applyColumnVisibility();
  
  const { price, percent } = getFormatters();
  const fx = currencyRates[currentCurrency] || { dayRateChange: 0 };
  
  // Check if we're in inventory mode (showing Value/Holdings columns)
  const isInventoryMode = showValueHoldings;
  
  if (isInventoryMode) {
    // INVENTORY MODE - Show Inventory Values instead of Market Cap
    
    // Update total card for inventory mode
    const totalInventoryValue = calculateTotalInventoryMarketCap();
    const previousTotalInventory = calculatePreviousInventoryValue(tableData, false);
    const totalChange = previousTotalInventory > 0 ? (totalInventoryValue - previousTotalInventory) / previousTotalInventory : 0;
    
    marketCapEl.textContent = price(convert(totalInventoryValue));
    marketChangeEl.textContent = percent(totalChange) + " in the past 24 hours";
    marketChangeEl.className = "card-change " + getChangeClass(totalChange);
    totalCardEl.classList.remove("card-positive","card-negative","card-neutral");
    totalCardEl.classList.add("card-" + getChangeClass(totalChange));
    
    // Update card labels for inventory mode
    document.querySelector("#total-card .card-label").textContent = "Total Inventory Value";
    
    // Update filtered card for inventory mode
    if (currentSearchQuery.trim() !== "") {
      const filteredInventoryValue = calculateFilteredInventoryMarketCap(processed);
      const previousFilteredInventory = calculatePreviousInventoryValue(processed, true);
      const filteredChange = previousFilteredInventory > 0 ? (filteredInventoryValue - previousFilteredInventory) / previousFilteredInventory : 0;
      
      filteredMarketCapEl.textContent = price(convert(filteredInventoryValue));
      filteredMarketChangeEl.textContent = percent(filteredChange) + " in the past 24 hours";
      filteredMarketChangeEl.className = "card-change " + getChangeClass(filteredChange);
      filteredCardEl.classList.remove("card-positive","card-negative","card-neutral");
      filteredCardEl.classList.add("card-" + getChangeClass(filteredChange));
      filteredCardEl.style.display = "block";
      
      // Update filtered card label for inventory mode
      document.querySelector("#filtered-card .card-label").textContent = "Inventory Value of Filtered Items";
    } else {
      filteredCardEl.style.display = "none";
    }
  } else {
    // MARKET MODE - Show Market Cap (original behavior)
    
    // Update total card for market mode
    const totalStats = calculateMarketCap(tableData);
    marketCapEl.textContent = price(convert(totalStats.current));
    marketChangeEl.textContent = percent(totalStats.change) + " in the past 24 hours";
    marketChangeEl.className = "card-change " + getChangeClass(totalStats.change);
    totalCardEl.classList.remove("card-positive","card-negative","card-neutral");
    totalCardEl.classList.add("card-" + getChangeClass(totalStats.change));
    
    // Update card labels for market mode
    document.querySelector("#total-card .card-label").textContent = "s&box Total Market Cap";
    
    // Update filtered card for market mode
    if (currentSearchQuery.trim() !== "") {
      const filteredStats = calculateMarketCap(processed);
      filteredMarketCapEl.textContent = price(convert(filteredStats.current));
      filteredMarketChangeEl.textContent = percent(filteredStats.change) + " in the past 24 hours";
      filteredMarketChangeEl.className = "card-change " + getChangeClass(filteredStats.change);
      filteredCardEl.classList.remove("card-positive","card-negative","card-neutral");
      filteredCardEl.classList.add("card-" + getChangeClass(filteredStats.change));
      filteredCardEl.style.display = "block";
      
      // Update filtered card label for market mode
      document.querySelector("#filtered-card .card-label").textContent = "Market Cap of Filtered Items";
    } else {
      filteredCardEl.style.display = "none";
    }
  }
}

  function handleHeaderClick(e) {
    const column = e.currentTarget.dataset.column;
    if (currentSortColumn === column) {
      currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";
    } else {
      currentSortColumn = column;
      currentSortDirection = "asc";
    }
    updateSortIndicators(e.currentTarget);
    updateView();
  }

  headers.forEach(header => header.addEventListener("click", handleHeaderClick));
  let searchSaveTimeout;

  searchInput.addEventListener("input", e => {
    currentSearchQuery = e.target.value.toLowerCase();

    clearTimeout(searchSaveTimeout);
    searchSaveTimeout = setTimeout(() => {
      localStorage.setItem("searchQuery", currentSearchQuery);
    }, 1000);

    updateView();
  });

  const currencySelect = document.getElementById("currency-select");

  currencySelect.addEventListener("change", (e) => {
    currentCurrency = e.target.value;

    // Save selection
    localStorage.setItem("selectedCurrency", currentCurrency);

    updateView();
  });

    // Handle inventory input changes
    tbody.addEventListener("input", (e) => {
      if (e.target.classList.contains("inventory-input")) {
        const itemName = e.target.dataset.item;
        const value = parseInt(e.target.value) || 0;
        inventoryData[itemName] = Math.max(0, value);
        saveInventory();
        updateView(); // Refresh to update the value column
      }
    });

    // Prevent negative numbers and non-integers
    tbody.addEventListener("keydown", (e) => {
      if (e.target.classList.contains("inventory-input")) {
        if (e.key === "-" || e.key === "." || e.key === "e") {
          e.preventDefault();
        }
      }
    });

async function init() {
  loadInventory();

  try {
    const response = await fetch("site_info.json", { cache: "no-store" });
    const rawData = await response.json();
    const savedMode = localStorage.getItem("inventoryMode");
    if (savedMode !== null) {
      showValueHoldings = savedMode === "true";
      const btn = document.getElementById("toggle-columns-btn");
      if (btn) {
        btn.textContent = showValueHoldings ? "MARKET" : "INVENTORY";
      }
    }

    currencyRates = { USD: { rate: 1 }, ...rawData.currencies };

    const currencySelect = document.getElementById("currency-select");

    Object.keys(currencyRates).forEach(code => {
      if (code === "USD") return;

      const option = document.createElement("option");
      option.value = code;
      option.textContent = code;
      currencySelect.appendChild(option);
    });

    const savedCurrency = localStorage.getItem("selectedCurrency");
    if (savedCurrency && currencyRates[savedCurrency]) {
      currentCurrency = savedCurrency;
      currencySelect.value = savedCurrency;
    }

    const savedSearch = localStorage.getItem("searchQuery");
    if (savedSearch) {
      currentSearchQuery = savedSearch;
      searchInput.value = savedSearch;
    }

    tableData = Object.entries(rawData.items).map(([item, obj]) => ({
      item,
      ...obj,
      bidMarketCap: (Number(obj.bid) || 0) * (Number(obj.supply) || 0),
      supplyDelta:
        (Number(obj.supply) || 0) -
        ((Number(obj.supply) || 0) / (1 + (Number(obj.daySupplyChange) || 0)))
    }));

    // 🔹 NEW: Find most recent lastUpdated
    const latestTimestamp = Math.max(
      ...tableData
        .filter(i => i.lastUpdated)
        .map(i => new Date(i.lastUpdated).getTime())
    );

    if (latestTimestamp) {
      const { date } = getFormatters()
      document.getElementById("last-updated").textContent =
        "Updated: " +
        date(new Date(latestTimestamp));
    }

    updateSortIndicators(
      document.querySelector(`th[data-column="${currentSortColumn}"]`)
    );

    updateView();
    // Ensure initial card labels are correct
    if (!showValueHoldings) {
      document.querySelector("#total-card .card-label").textContent = "s&box Total Market Cap";
      document.querySelector("#filtered-card .card-label").textContent = "Market Cap of Filtered Items";
    }
    
    const toggleBtn = document.getElementById("toggle-columns-btn");
    if (toggleBtn) toggleBtn.addEventListener("click", toggleColumns);
  } catch (error) {
    console.error("Failed to load data:", error);
  }
}

  init();
})();
</script>
