name: Update Number Every Hour

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 */2 * * *'
  # Allows manual triggering
  workflow_dispatch:
  # Run on initial push to set things up
  push:
    branches: [ main ]

jobs:
  update-prices:
    runs-on: ubuntu-latest

    # Required to push changes back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Only needed if your script uses requests or other libs
      - name: Install dependencies
        run: |
          pip install requests
          pip install selenium

      - name: Fetch prices and update JSON
        run: python scripts/update_prices.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add item_info.json
          git commit -m "Update item_info.json" || echo "No changes to commit"
          git add site_info.json
          git commit -m "Update site_info.json" || echo "No changes to commit"          
          git push
